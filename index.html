<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Maltes Chillseite</title>
    <link rel="stylesheet" href="chillseitestyle2.css">
    <script src="Script2.js"></script>
</head>

<body>
    <div class="rain-settings-dock">
        <button class="rain-settings-gear" aria-label="Regeneinstellungen öffnen">
            ⚙
        </button>

        <div class="rain-settings-popout">
            <label>
                Stärke
                <input type="range" min="20" max="200" value="90" class="rain-intensity-slider">
            </label>

            <label>
                Wind
                <input type="range" min="0" max="20" value="6" class="rain-wind-slider">
            </label>

            <label>
                Opacity
                <input type="range" min="0" max="100" value="70" class="rain-opacity-slider">
            </label>

            <div class="rain-settings-actions">
                <label class="rain-toggle-switch icon-toggle-switch">
                    <input type="checkbox" class="rain-enabled-toggle" checked>

                    <span class="toggle-icon left-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="M7 16h9a4 4 0 0 0 0-8 5.5 5.5 0 0 0-10.4 1.7A3.5 3.5 0 0 0 7 16Z"></path>
                            <line x1="5" y1="19" x2="19" y2="5"></line>
                        </svg>
                    </span>

                    <span class="rain-toggle-slider"></span>

                    <span class="toggle-icon right-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="M7 16h9a4 4 0 0 0 0-8 5.5 5.5 0 0 0-10.4 1.7A3.5 3.5 0 0 0 7 16Z"></path>
                            <line x1="9" y1="18" x2="8" y2="20"></line>
                            <line x1="13" y1="18" x2="12" y2="20"></line>
                            <line x1="17" y1="18" x2="16" y2="20"></line>
                        </svg>
                    </span>
                </label>

                <label class="rain-toggle-switch icon-toggle-switch">
                    <input type="checkbox" class="cow-enabled-toggle">

                    <span class="toggle-icon left-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="M6 14c0-3.8 2.8-6 6-6s6 2.2 6 6"></path>
                            <path d="M8 13.5c.8 2 2.4 3.5 4 3.5s3.2-1.5 4-3.5"></path>
                            <path d="M8 9.5 6.2 7.8"></path>
                            <path d="M16 9.5 17.8 7.8"></path>
                            <line x1="5" y1="19" x2="19" y2="5"></line>
                        </svg>
                    </span>

                    <span class="rain-toggle-slider"></span>

                    <span class="toggle-icon right-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="M6 14c0-3.8 2.8-6 6-6s6 2.2 6 6"></path>
                            <path d="M8 13.5c.8 2 2.4 3.5 4 3.5s3.2-1.5 4-3.5"></path>
                            <path d="M8 9.5 6.2 7.8"></path>
                            <path d="M16 9.5 17.8 7.8"></path>
                            <circle cx="9.4" cy="13" r=".8" fill="currentColor" stroke="none"></circle>
                            <circle cx="14.6" cy="13" r=".8" fill="currentColor" stroke="none"></circle>
                        </svg>
                    </span>
                </label>

                <label class="rain-toggle-switch icon-toggle-switch">
                    <input type="checkbox" class="fog-enabled-toggle" checked>

                    <span class="toggle-icon left-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="M4 10.5h16"></path>
                            <path d="M6 14h12"></path>
                            <path d="M8 17.5h8"></path>
                            <line x1="5" y1="19" x2="19" y2="5"></line>
                        </svg>
                    </span>

                    <span class="rain-toggle-slider"></span>

                    <span class="toggle-icon right-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="M4 10.5h16"></path>
                            <path d="M6 14h12"></path>
                            <path d="M8 17.5h8"></path>
                        </svg>
                    </span>
                </label>

                <button class="rain-reset-button">Zurücksetzen</button>
            </div>
        </div>
    </div>

    <div class="fog-layer">
        <span class="fog-cloud fog-1"></span>
        <span class="fog-cloud fog-2"></span>
        <span class="fog-cloud fog-3"></span>
    </div>

    <canvas id="rain-canvas"></canvas>
    <div class="page-scroll">
        <main class="app">

            <div class="mixer-area">

                <div class="audio-row">
                    <div class="boxes-container">
                        <div class="audio-box">
                            <div class="slider-container">
                                <div class="volume-slider" data-value="70">
                                    <div class="volume-fill"></div>
                                    <div class="volume-thumb"></div>
                                </div>
                            </div>

                            <select class="audio-select">
                                <option value="https://pub-de19fea77e644965aaf4d90d78fc0089.r2.dev/rain.mp3">Regen</option>
                                <option value="https://pub-de19fea77e644965aaf4d90d78fc0089.r2.dev/waves.mp3">Wellen</option>
                                <option value="https://pub-de19fea77e644965aaf4d90d78fc0089.r2.dev/forest.mp3">Wald</option>
                                <option value="https://pub-de19fea77e644965aaf4d90d78fc0089.r2.dev/fire.mp3">Kamin</option>
                                <option value="https://pub-de19fea77e644965aaf4d90d78fc0089.r2.dev/regenzelt.mp3">Zelt</option>
                                <option value="https://pub-de19fea77e644965aaf4d90d78fc0089.r2.dev/brown.mp3">Brown Noise</option>
                            </select>


                            <div class="button-row">
                                <button class="mute-button icon-button" aria-label="Stummschalten">
                                    <svg class="icon-volume" viewBox="0 0 24 24">
                                        <path d="M3 10v4h4l5 4V6L7 10H3z"></path>
                                        <path d="M16 9a4 4 0 0 1 0 6"></path>
                                        <path d="M18.5 7a7 7 0 0 1 0 10"></path>
                                    </svg>

                                    <svg class="icon-volume-muted" viewBox="0 0 24 24">
                                        <path d="M3 10v4h4l5 4V6L7 10H3z"></path>
                                        <line x1="16" y1="8" x2="22" y2="14"></line>
                                        <line x1="22" y1="8" x2="16" y2="14"></line>
                                    </svg>
                                </button>

                                <button class="play-button play-main-button" aria-label="Play oder Pause">
                                    <svg class="icon-play" viewBox="0 0 24 24">
                                        <polygon points="8,5 19,12 8,19"></polygon>
                                    </svg>

                                    <svg class="icon-pause" viewBox="0 0 24 24">
                                        <rect x="6" y="5" width="4" height="14"></rect>
                                        <rect x="14" y="5" width="4" height="14"></rect>
                                    </svg>
                                </button>

                                <button class="remove-button icon-button" aria-label="Panel entfernen">
                                    <svg viewBox="0 0 24 24">
                                        <line x1="7" y1="7" x2="17" y2="17"></line>
                                        <line x1="17" y1="7" x2="7" y2="17"></line>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <button class="add-button" aria-label="Neues Panel hinzufügen"></button>
                </div>

            </div>
        </main>
    </div>

    <div class="sleepy-cow-signature" aria-hidden="true">
        <div class="cow-zzz-layer">
            <span class="cow-zzz z1">z</span>
            <span class="cow-zzz z2">z</span>
            <span class="cow-zzz z3">z</span>
        </div>

        <div class="cow-image-wrap">
            <img src="cow-sleep.png" alt="" class="sleepy-cow-image">
        </div>
    </div>
</body>
</html>
